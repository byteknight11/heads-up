name: Deploy server

on:
  # Deploy only after CI passes on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Create the app on first run
        run: |
          app=$(grep '^app' fly.toml | cut -d'"' -f2)
          flyctl status --app "$app" >/dev/null 2>&1 || flyctl apps create "$app" --org personal
      - name: Sync secrets
        run: flyctl secrets set --stage AUTH_SECRET="$AUTH_SECRET" DATABASE_URL="$DATABASE_URL"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: flyctl deploy --remote-only --ha=false
