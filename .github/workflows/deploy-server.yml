name: Deploy server

on:
  push:
    branches: [main]
    paths-ignore: ['apps/web/**']
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app on first run
        run: |
          app=$(grep '^app' fly.toml | cut -d'"' -f2)
          flyctl status --app "$app" >/dev/null 2>&1 || flyctl apps create "$app" --org personal
      - name: Sync secrets
        run: flyctl secrets set --stage AUTH_SECRET="$AUTH_SECRET" DATABASE_URL="$DATABASE_URL"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: flyctl deploy --remote-only --ha=false
